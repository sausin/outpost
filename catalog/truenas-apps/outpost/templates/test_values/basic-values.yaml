resources:
  limits:
    cpus: 2.0
    memory: 1024

outpost:
  redis_password: outpost
  default_provider: ""
  additional_envs:
    - name: EXAMPLE_API_KEY
      value: test-credential-not-a-real-secret

run_as:
  user: 568
  group: 568

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 30462
  networks: []

ix_volumes:
  config: /opt/tests/mnt/outpost/config

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  additional_storage: []

labels: []
